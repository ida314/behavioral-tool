services:
  db:
    image: postgres:17-alpine
    container_name: behavioral-prep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: behavioral
      POSTGRES_PASSWORD: behavioral
      POSTGRES_DB: behavioral_prep
    ports:
      # 5433 on the host so this never collides with another local Postgres.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U behavioral -d behavioral_prep"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
